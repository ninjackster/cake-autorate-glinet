name: lint

# There is no way to test this project without GL hardware, so CI covers the
# one class of bug that is catchable without it: shell that is wrong for the
# interpreter it will actually run under. The checks live in ci/lint.sh so the
# same code runs locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install checkers
        run: |
          # Ubuntu's packaged shellcheck is old enough to reject "-s busybox"
          # with "Unknown shell", which silently checks nothing. ci/lint.sh
          # falls back to the ash dialect in that case, but the busybox dialect
          # is the accurate one for these scripts, so fetch a current build.
          SC_VER=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VER}/shellcheck-${SC_VER}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-${SC_VER}/shellcheck"
          chmod +x /usr/local/bin/shellcheck
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.3

      - name: Versions
        run: |
          shellcheck --version | grep version
          luac5.3 -v || true

      - name: Run checks
        run: |
          # the script looks for luac; Debian names it luac5.3
          if ! command -v luac >/dev/null && command -v luac5.3 >/dev/null; then
            sudo ln -sf "$(command -v luac5.3)" /usr/local/bin/luac
          fi
          ./ci/lint.sh
